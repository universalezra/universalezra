<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title id="doc-title">Gateway</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background-color:#030305;background-size:cover;background-position:center;background-attachment:fixed;font-family:'Courier New',Courier,monospace;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;transition:background-image.8s ease-in-out}.overlay{background:rgba(10,10,20,.85);backdrop-filter:blur(5px);border:1px solid rgba(0,255,255,.2);border-radius:15px;box-shadow:0 0 30px rgba(0,168,255,.2);padding:30px;max-width:500px;width:90%;text-align:center;z-index:10}#display-title{color:#00a8ff;margin-bottom:15px;letter-spacing:2px;text-transform:uppercase;font-size:1.8rem;text-shadow:0 0 10px rgba(0,168,255,.5)}.floating-question{font-size:1.1em;font-weight:bold;color:#00ffcc;margin-bottom:20px;text-shadow:0 0 10px rgba(0,255,204,.5)}.radio-group{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;text-align:left;background:rgba(0,0,0,.4);padding:12px;border-radius:8px;border:1px solid rgba(0,255,255,.1)}.radio-label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.95em;color:#e0fbfc;transition:.2s}.radio-label:hover{color:#00ffcc}.options{display:flex;justify-content:center;gap:15px}button{background:transparent;color:#00a8ff;border:2px solid #00a8ff;padding:10px 25px;font-size:1em;font-family:inherit;cursor:pointer;border-radius:8px;font-weight:bold;transition:all.3s ease}button:hover{background:#00a8ff;color:#000;box-shadow:0 0 20px rgba(0,168,255,.6);transform:scale(1.05)}#btn-no{color:#ff3366;border-color:#ff3366}#btn-no:hover{background:#ff3366;color:#000;box-shadow:0 0 20px rgba(255,51,102,.6)}#edit-btn{position:fixed;top:20px;left:20px;background:#00a8ff;color:#000;width:38px;height:38px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:16px;cursor:grab;z-index:9999;box-shadow:0 0 10px rgba(0,168,255,.5);user-select:none;border:none}#edit-btn:active{cursor:grabbing}.editor-panel{position:fixed;bottom:-3000px;right:50px;width:320px;background:rgba(10,10,20,.95);border:1px solid #00a8ff;border-radius:10px 10px 0 0;padding:20px;box-shadow:0 0 20px rgba(0,168,255,.3);transition:bottom.4s ease;z-index:10000}.editor-panel.open{bottom:0}.form-group{margin-bottom:12px;display:flex;flex-direction:column}.form-group label{color:#00ffcc;font-size:11px;margin-bottom:4px;font-weight:bold}.form-group input{background:#000;color:#fff;border:1px solid #333;padding:6px;font-family:inherit;border-radius:4px;outline:none}.form-group input:focus{border-color:#00a8ff}.btn-save{width:100%;background:#00a8ff;color:#000;border:none;padding:8px;font-weight:bold;cursor:pointer;font-family:inherit;border-radius:4px}.btn-save:hover{background:#fff}#close-edit{position:absolute;top:5px;right:10px;color:#ff3366;cursor:pointer;font-weight:bold}.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);color:var(--chakra-color);border:0 solid var(--chakra-color);padding:10px 5px;text-decoration:none;font-size:1rem;z-index:1500;transition:.3s;box-shadow:0 0 10px rgba(255,0,0,.3);cursor:pointer}.nav-arrow.right{right:0;border-radius:5px 0 0 10px;border-right:none}</style></head><body><a href="https://anyezra.pages.dev" class="nav-arrow right" title="w.Center">&#10095;</a><div class="overlay"><h1 id="display-title">Gateway</h1><div class="floating-question">Pilih Website</div><div class="radio-group"><label class="radio-label"><input type="radio" name="dest" value="https://universalezra.netlify.app">Universal Ezra</label><label class="radio-label"><input type="radio" name="dest" value="https://uchihaezra.netlify.app">Uchiha Ezra</label><label class="radio-label"><input type="radio" name="dest" value="https://eownerf.netlify.app">Eownerf Ezra</label></div><div class="options"><button id="btn-yes">Go</button><button id="btn-no">Back</button></div></div><button id="edit-btn" title="Edit Background">EDIT</button><div class="editor-panel" id="editor-panel"><span id="close-edit" onclick="toggleEditor()">X</span><h3 style="color:#00a8ff;margin-bottom:10px;font-size:13px"></h3><div class="form-group"><label>Background</label><input type="text" id="input-bg" placeholder=""></div><div class="form-group"><label>Gateway</label><input type="text" id="input-title" placeholder=""></div><div class="form-group"><label>Password</label><input type="password" id="input-pass" placeholder=""></div><button class="btn-save" onclick="saveConfiguration()">SAVE</button></div><script>const BACKEND_URL="https://test.anyezra.workers.dev";const FALLBACK_NO_URL="https://anyezra.pages.dev";document.getElementById('btn-yes').addEventListener('click',()=>{const selected=document.querySelector('input[name="dest"]:checked');const targetUrl=selected?selected.value:FALLBACK_NO_URL;window.location.href=targetUrl});document.getElementById('btn-no').addEventListener('click',()=>{window.location.href=FALLBACK_NO_URL});function toggleEditor(){document.getElementById('editor-panel').classList.toggle('open')}async function loadConfiguration(){try{const res=await fetch(`${BACKEND_URL}/api/site-config`);const data=await res.json();if(res.ok){if(data.bgUrl)document.body.style.backgroundImage=`url('${data.bgUrl}')`;if(data.title){document.getElementById('doc-title').innerText=data.title;document.getElementById('display-title').innerText=data.title}if(data.bgUrl)document.getElementById('input-bg').value=data.bgUrl;if(data.title)document.getElementById('input-title').value=data.title}}catch(err){console.error("Gagal memuat konfiguras.")}}async function saveConfiguration(){const bgUrl=document.getElementById('input-bg').value;const title=document.getElementById('input-title').value;const pass=document.getElementById('input-pass').value;if(!pass)return alert("SYSTEM ERR: Masukkan Master Password!");try{const res=await fetch(`${BACKEND_URL}/api/site-config`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bgUrl,title,content:"",textColor:"",pass})});const data=await res.json();if(res.ok){alert("SUCCESS: Konfigurasi berhasil disimpan.");document.getElementById('input-pass').value='';toggleEditor();loadConfiguration()}else{alert(data.error||"Gagal menyimpan data.")}}catch(err){alert("ERR: Terputus dari server.")}}window.onload=loadConfiguration;const eBtn=document.getElementById("edit-btn");let isDrag=false,moved=false,stX,stY,inX,inY;eBtn.addEventListener("mousedown",dS);document.addEventListener("mousemove",dM);document.addEventListener("mouseup",dE);eBtn.addEventListener("touchstart",dS,{passive:true});document.addEventListener("touchmove",dM,{passive:false});document.addEventListener("touchend",dE);function dS(e){isDrag=true;moved=false;stX=e.type.includes("mouse")?e.clientX:e.touches[0].clientX;stY=e.type.includes("mouse")?e.clientY:e.touches[0].clientY;inX=eBtn.offsetLeft;inY=eBtn.offsetTop;eBtn.style.cursor="grabbing"}function dM(e){if(!isDrag)return;if(e.type.includes("touch"))e.preventDefault();const cX=e.type.includes("mouse")?e.clientX:e.touches[0].clientX;const cY=e.type.includes("mouse")?e.clientY:e.touches[0].clientY;if(Math.abs(cX-stX)>5||Math.abs(cY-stY)>5)moved=true;let nX=inX+(cX-stX);let nY=inY+(cY-stY);let mW=window.innerWidth-45;let mH=window.innerHeight-45;if(nX<0)nX=0;if(nX>mW)nX=mW;if(nY<0)nY=0;if(nY>mH)nY=mH;eBtn.style.left=nX+"px";eBtn.style.top=nY+"px";eBtn.style.bottom="auto";eBtn.style.right="auto"}function dE(){isDrag=false;eBtn.style.cursor="grab"}eBtn.onclick=(e)=>{if(!moved)toggleEditor()};</script></body></html>
